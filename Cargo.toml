[package]
name = "pdf_decorder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", features = ["glow", "wgpu"] }
lopdf = "0.47"
rayon = "1"
rfd = "0.18"
rusqlite = { version = "0.42", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "github", "archive-zip", "compression-zip-deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
